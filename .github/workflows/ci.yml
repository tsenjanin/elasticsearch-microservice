# Runs the tests and the release version check on every PR to main, so a PR that bumps pom.xml without a CHANGELOG
# entry, or lowers the version, fails before it is merged.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Check release version
        run: bash .github/scripts/release-check.sh
